<form [formGroup]="addressForm" (ngSubmit)="saveAddress()">
    <div class="mt-4 space-y-4 border-t border-slate-100 pt-4">
        <div class="grid gap-4 sm:grid-cols-2">
            <div>
                <label class="mb-1 block text-xs font-semibold text-slate-700">Full Name</label>
                <input formControlName="fullName" type="text"
                    class="w-full rounded-xl border border-slate-200 px-4 py-2 text-sm outline-none focus:border-blue-400"
                    placeholder="Full name" />
            </div>
            <div>
                <label class="mb-1 block text-xs font-semibold text-slate-700">Phone Number</label>
                <input formControlName="phone" type="tel"
                    class="w-full rounded-xl border border-slate-200 px-4 py-2 text-sm outline-none focus:border-blue-400"
                    placeholder="Phone number" />
            </div>
            <div class="sm:col-span-2">
                <label class="mb-1 block text-xs font-semibold text-slate-700">Street Address</label>
                <input formControlName="streetAddress" type="text"
                    class="w-full rounded-xl border border-slate-200 px-4 py-2 text-sm outline-none focus:border-blue-400"
                    placeholder="Street address" />
            </div>
            <div>
                <label class="mb-1 block text-xs font-semibold text-slate-700">City</label>
                <input formControlName="city" type="text"
                    class="w-full rounded-xl border border-slate-200 px-4 py-2 text-sm outline-none focus:border-blue-400"
                    placeholder="City" />
            </div>
            <div>
                <label class="mb-1 block text-xs font-semibold text-slate-700">Postal Code</label>
                <input formControlName="postalCode" type="text"
                    class="w-full rounded-xl border border-slate-200 px-4 py-2 text-sm outline-none focus:border-blue-400"
                    placeholder="Postal code" />
            </div>
        </div>
        <div class="flex justify-end gap-2">
            <button type="button"
                class="cursor-pointer rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-600"
                (click)="requestCancel.emit()">Cancel</button>
            <button type="submit"
            class="cursor-pointer rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white">Save
                Address</button>
        </div>
    </div>
</form>
