<div class="w-full">
    <button tabindex="-1" matIconButton class="close-dialog-button" mat-dialog-close>
        <mat-icon>close</mat-icon>
    </button>
    <!-- Logo -->
    <div class="text-center mb-8 mt-8">
        <div
            class="inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-600 to-cyan-500 text-2xl font-black text-white shadow-lg mb-4">
            TR</div>
        <h1 class="text-2xl font-black text-slate-900">Join Tech Role</h1>
        <p class="text-sm text-slate-500 mt-1">Create your account and start shopping</p>
    </div>

    <!-- Signup Card -->
    <div class="bg-white/90 backdrop-blur-sm rounded-3xl shadow-card border border-slate-100 p-8">
        <form [formGroup]="signUpForm" (ngSubmit)="signUp()">
            <!-- Full Name -->
            <div class="mb-4">
                <label class="mb-2 block text-sm font-semibold text-slate-700">Full Name</label>
                <input formControlName="name" type="text"
                    class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition-all"
                    placeholder="Mohammad" />
            </div>

            <!-- Email -->
            <div class="mb-4">
                <label class="mb-2 block text-sm font-semibold text-slate-700">Email Address</label>
                <input formControlName="email" type="email"
                    class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition-all"
                    placeholder="Mohammad@TechRole.com" />
            </div>

            <!-- Phone Number -->
            <!-- <div class="mb-4">
            <label class="mb-2 block text-sm font-semibold text-slate-700">Phone Number</label>
            <input type="tel" 
                   class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition-all"
                   placeholder="+1 234 567 8900" />
          </div> -->

            <!-- Password -->
            <div class="mb-3 relative">
                <label class="mb-2 block text-sm font-semibold text-slate-700">Password</label>
                <div class="relative">
                    <input formControlName="password" [type]="passwordVisible()? 'text' : 'password'"
                        class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition-all pr-12"
                        placeholder="••••••••" />
                    <button type="button"
                        class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 hover:text-slate-600 transition-colors">
                        @if(passwordVisible()){
                        <!-- Eye slash icon (hidden mode) -->
                        <svg (click)="passwordVisible.set(false)" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 cursor-pointer">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 0 1-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>

                        } @else {
                        <!-- Eye icon (visible mode) -->
                        <svg (click)="passwordVisible.set(true)" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 cursor-pointer">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
                        </svg>
                        }
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-5">
                <label class="mb-2 block text-sm font-semibold text-slate-700">Confirm Password</label>
                <input type="password"
                    class="cursor-pointer w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition-all"
                    placeholder="Confirm your password" />
            </div>

            <!-- Terms & Conditions -->
            <div class="mb-6">
                <label class="flex items-start gap-2 text-sm text-slate-600">
                    <input type="checkbox" class="mt-0.5 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
                    <span>I agree to the <a href="#" class="text-blue-600 hover:underline">Terms of Service</a> and <a
                            href="#" class="text-blue-600 hover:underline">Privacy Policy</a></span>
                </label>
            </div>

            <!-- Signup Button -->
            <button type="submit"
                class="w-full rounded-2xl bg-gradient-to-r from-blue-600 to-cyan-500 py-3.5 text-sm font-bold text-white transition hover:from-blue-700 hover:to-cyan-600 shadow-md">
                Create Account
            </button>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-200"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="bg-white px-4 text-slate-500">or sign up with</span>
                </div>
            </div>

            <!-- Social Signup -->
            <div class="grid grid-cols-2 gap-3">
                <button
                    class="flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg>
                    Google
                </button>
                <button
                    class="flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
                    <svg class="h-5 w-5 text-[#1877F2]" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M24 12.07C24 5.41 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.96h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.32l-.53 3.48h-2.8V24C19.62 23.1 24 18.1 24 12.07Z" />
                    </svg>
                    Facebook
                </button>
            </div>

            <!-- Login Link -->
            <p class="mt-8 text-center text-sm text-slate-500">
                Already have an account?
                <a (click)="openSignUpDialog()" class="cursor-pointer font-semibold text-blue-600 hover:underline">Sign in</a>
            </p>
        </form>
    </div>
</div>
