<!-- Payment Method -->
<div class="rounded-2xl border border-slate-200 bg-white shadow-soft overflow-hidden">
    <div class="border-b border-slate-100 bg-gradient-to-r from-blue-50 to-cyan-50 px-6 py-4">
        <div class="flex items-center gap-2">
            <span class="text-xl">💳</span>
            <h2 class="text-lg font-black text-slate-900">Payment Method</h2>
        </div>
    </div>

    <div class="p-6">
        <div class="space-y-3">
            <!-- Credit Card -->
            <label class="flex cursor-pointer items-start gap-3 rounded-xl border-2 border-blue-200 bg-blue-50 p-4">
                <input type="radio" name="payment" class="mt-1" checked />
                <div class="flex-1">
                    <div class="flex items-center justify-between">
                        <p class="font-semibold text-slate-900">Credit / Debit Card</p>
                        <div class="flex gap-1">
                            <span class="text-xl">💳</span>
                            <span class="text-xl">💳</span>
                        </div>
                    </div>
                    <div class="mt-3 grid gap-3 sm:grid-cols-2">
                        <input type="text" placeholder="Card Number"
                            class="rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-400" />
                        <input type="text" placeholder="Cardholder Name"
                            class="rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-400" />
                        <input type="text" placeholder="MM/YY"
                            class="rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-400" />
                        <input type="text" placeholder="CVC"
                            class="rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-400" />
                    </div>
                </div>
            </label>

            <!-- PayPal -->
            <label
                class="flex cursor-pointer items-center justify-between rounded-xl border border-slate-200 p-4 transition hover:bg-slate-50">
                <div class="flex items-center gap-3">
                    <input type="radio" name="payment" />
                    <div>
                        <p class="font-semibold text-slate-900">PayPal</p>
                        <p class="text-xs text-slate-500">Pay with your PayPal account</p>
                    </div>
                </div>
                <span class="text-2xl">🅿️</span>
            </label>

            <!-- Google Pay -->
            <label
                class="flex cursor-pointer items-center justify-between rounded-xl border border-slate-200 p-4 transition hover:bg-slate-50">
                <div class="flex items-center gap-3">
                    <input type="radio" name="payment" />
                    <div>
                        <p class="font-semibold text-slate-900">Google Pay</p>
                        <p class="text-xs text-slate-500">Fast and secure checkout</p>
                    </div>
                </div>
                <span class="text-2xl">📱</span>
            </label>

            <!-- Cash on Delivery -->
            <label
                class="flex cursor-pointer items-center justify-between rounded-xl border border-slate-200 p-4 transition hover:bg-slate-50">
                <div class="flex items-center gap-3">
                    <input type="radio" name="payment" />
                    <div>
                        <p class="font-semibold text-slate-900">Cash on Delivery</p>
                        <p class="text-xs text-slate-500">Pay when you receive your order</p>
                    </div>
                </div>
                <span class="text-xl">💵</span>
            </label>
        </div>
    </div>
</div>
