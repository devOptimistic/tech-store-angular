<div class="mx-auto max-w-7xl px-4 py-8 lg:px-8 lg:py-10">
    
    <!-- Progress Steps -->
    <div class="mb-8 flex items-center justify-center gap-2 sm:gap-6">
      <div class="flex items-center gap-2">
        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-green-600 text-white text-sm font-bold">✓</div>
        <span class="hidden text-sm font-semibold text-green-600 sm:inline">Shopping Cart</span>
      </div>
      <div class="h-px w-8 bg-green-600 sm:w-12"></div>
      <div class="flex items-center gap-2">
        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-blue-600 text-white text-sm font-bold">2</div>
        <span class="hidden text-sm font-semibold text-blue-600 sm:inline">Checkout</span>
      </div>
      <div class="h-px w-8 bg-slate-300 sm:w-12"></div>
      <div class="flex items-center gap-2">
        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-300 text-white text-sm font-bold">3</div>
        <span class="hidden text-sm font-semibold text-slate-400 sm:inline">Payment</span>
      </div>
      <div class="h-px w-8 bg-slate-300 sm:w-12"></div>
      <div class="flex items-center gap-2">
        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-300 text-white text-sm font-bold">4</div>
        <span class="hidden text-sm font-semibold text-slate-400 sm:inline">Confirmation</span>
      </div>
    </div>

    <div class="grid gap-8 lg:grid-cols-3">
      
      <!-- Left Column: Forms -->
      <div class="lg:col-span-2 space-y-6">
        
        <app-shipping-form />

        <app-shipping-method />
        
        <app-payment-form />

        <app-order-notes-form />

      </div>

      <!-- Right Column: Order Summary -->
      <app-summarize-order>
        <ng-container actionButtons>
            <button
                [disabled]="store.loading()"
                (click)="store.placeOrder()"
                class="cursor-pointer w-full rounded-2xl bg-blue-600 px-6 py-4 text-sm font-semibold text-white transition hover:bg-blue-500 disabled:bg-blue-500">
                {{store.loading()? 'Processing...' : 'Place Order'}}
              </button>
            
        </ng-container>
      </app-summarize-order>
    </div>
  </div>
