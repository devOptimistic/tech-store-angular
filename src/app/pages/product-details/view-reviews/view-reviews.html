<div class="rounded-[32px] border border-slate-200 bg-white p-5 shadow-soft sm:p-7">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h2 class="text-2xl font-black tracking-tight text-slate-950">Customer Reviews</h2>
            <p class="mt-2 text-sm text-slate-500">Real feedback from verified buyers</p>
        </div>
        <button
            class="rounded-2xl border border-slate-200 bg-white px-5 py-3 text-sm font-semibold text-slate-700">Write a
            Review</button>
    </div>

    <div class="mt-6 grid gap-4 lg:grid-cols-[220px_1fr]">
        <app-rating-summary [product]="product()" />

        <div class="space-y-4">
            @for (review of sortedReviews(); track review.id) {
                <app-view-review-item [review]="review"/>
            }
        </div>
    </div>
</div>
